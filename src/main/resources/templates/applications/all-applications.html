                            </div>
                          </div>
                        </div>
                        <div class="col-md-2">
                          <div class="form-group row">

                              <select class="form-control" th:name="technology"  id="technologyDDL">
								  <option value="All">--Technology--</option>
                                <option th:each="p : ${technologyList}" th:value="${p}" th:text="${p}" th:selected="${p==technology}"/>
                              </select>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-3">
                          <div class="form-group row">

                        </div>

                            <div class="col-sm-12">
                              <div class="col-sm-12">

								  <option value="All">--Series--</option>

                              </select>
                            </div>
                            </div>
                          </div>
                        </div>
                        <div class="col-md-2">

                            <div class="col-sm-10">
							  <select class="form-control" th:name="businessStream"  id="businessStreamDDL">
  								 <option value="All">--Business Stream--</option>
                                  <option th:each="p : ${businessStreamList}" th:value="${p}" th:text="${p}" th:selected="${p==businessStream}"/>
                                </select>
                            </div>
                          </div>
                        </div>
                      </div>

                            </div>

                        <div class="col-md-3">
                          <div class="form-group row">
                            <div class="col-sm-9">

								  <option value="All">--Environment--</option>
                                <option th:each="p : ${ticketEnvironmentList}" th:value="${p}" th:text="${p}"   th:selected="${p==ticketEnvironment}"/>
                              </select>-->
                            </div>
                          </div>
                        </div>

                                <option>Female</option>
                              </select>-->
                            </div>

						  		<button type="reset" class="btn btn-light">Reset</button>
						  		<button type="submit" class="btn btn-success mr-2" >Search</button>						  
					  		</div>
                            </div>
                          </div>
                        </div>

                    <table class="table table-bordered table-hover table-striped">
                      <thead>
                        <tr >
                          <th> Full Name </th>
                          <th> Abb Name </th>
                          <th> Business Stream </th>
                          <th> Technologies </th>
                          <th> <a class="btn btn-primary" href="/tickets/ticket-form" role="button">Add</a> </th>
                        </tr>
                      </thead>
                      <tbody>

                          <td th:text="${app.technology}"></td>
                          <td >

                          <a th:href="@{'member-appraisal-detail/'+ ${app.id}+'/'+${year}}" role="button"><i class="fa fa-info fa-lg"></i></a>
                          
                          </td>
                        </tr>                     
                        
                      </tbody>
                    </table>
                  </div>
