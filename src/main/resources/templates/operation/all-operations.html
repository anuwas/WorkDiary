<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
	<div th:replace="fragments/headerfiles :: headerfiles(pageTitle='Operations')"></div>
	    <link href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css"/>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper">
		<div th:replace="fragments/_sidebar :: _sidebar"></div>
        <!-- partial -->
        <div class="main-panel">
          <div class="content-wrapper">           
            <div class="row">
              <div class="col-md-6">
                <div class="row">    
                  <div class="col-md-12 grid-margin">
                    <div class="card">
                      <div class="card-body">
						<div class="d-flex justify-content-between pb-3">
	                      <h4 class="card-title mb-0">Active Operations</h4>
	                    </div>
						<ul class="timeline">
	                      <li class="timeline-item" th:each="activeOperation : ${listAllOperation}">
	                        <p class="timeline-content"><a th:href="'/operation/'+${activeOperation.operation_id}"  th:text="${activeOperation.operationName}">Ben Tossell</a> <span th:text="${activeOperation.operationName}"></span></p>
	                      </li>
	                    </ul>                 
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-6">
                <div class="row">
                  <div class="col-md-12 grid-margin">
                    <div class="card">
                      <div class="card-body">
                        <h1 class="card-title mb-4">Create New Operation</h1>
                        <div class="row">
							<form action="#" th:action="@{/savenewoperation}" method="post" th:object="${operationObject}">
		                      <div class="form-group">
		                        <label for="exampleInputName1">Name</label>
		                        <input type="text" class="form-control" th:field="*{operationName}" id="operationName" placeholder="Operation Name">
		                      </div>                      
		                      <div class="form-group">
		                        <label for="exampleTextarea1">Description</label>
		                        <textarea class="form-control" th:field="*{operationDescription}" id="operationDescription" rows="2"></textarea>
		                      </div>
		                      <button type="submit" class="btn btn-success mr-2">Submit</button>
		                      <button class="btn btn-light">Cancel</button>
		                    </form>          
                        </div>                        
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>           
          </div>
          <div th:replace="fragments/footer :: footer"></div>
        </div>
      </div>
    </div>
  </body>
</html>
