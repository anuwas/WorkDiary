<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
	<div th:replace="fragments/headerfiles :: headerfiles(pageTitle='Refinements')"></div>
	<link href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css"/>
	<script src="https://cdn.tiny.cloud/1/xb35xk73hgyckinp46g6ivh20vtxgb0soa2tn1e22n7cc4iu/tinymce/5/tinymce.min.js" referrerpolicy="origin"></script>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper">
		<div th:replace="fragments/_sidebar :: _sidebar"></div>
        <!-- partial -->
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="row">
              <div class="col-md-4">
                <div class="row">
                  <div class="col-md-12 grid-margin">
                    <div class="card">
                      <div class="card-body">
						<div class="d-flex justify-content-between pb-3">
	                      <h4 class="card-title mb-0">Refinements</h4>
	                    </div>
						<ul class="timeline">
	                      <li class="timeline-item" th:each="refinement : ${refinementsList}">
	                        <p class="timeline-content"><a th:href="@{'/refinement-edit/'+ ${refinement.id}}"
								th:text="${refinement.applicationName}">Application</a>
								<span th:if="${refinement.refinementDate != null}" th:text="'(' + ${#dates.format(refinement.refinementDate, 'dd-MMM-yyyy')} + ')'"></span></p>
	                      </li>
	                    </ul>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
              <div class="col-md-8">
                <div class="row">
                  <div class="col-md-12 grid-margin">
                    <div class="card">
                      <div class="card-body">
                        <h1 class="card-title mb-4">Create New Refinement</h1>
                        <div class="row">
							<form action="#" th:action="@{/saverefinement}" method="post" th:object="${refinementsObject}">
	  						   <div class="row">
								<div class="col-md-8">
									  <div class="form-group row">
										<label class="col-sm-6 col-form-label">Application</label>
									    <div class="col-sm-12">
									      <input type="text" class="form-control" th:name="applicationName" th:field="*{applicationName}" placeholder="Application Name"/>
									    </div>
									  </div>
									</div>
									<div class="col-md-4">
									<div class="form-group row">
										<label class="col-sm-6 col-form-label">Refinement Date</label>
									    <div class="col-sm-12">
									      <input class="form-control" id="datepicker" readonly="readonly" th:field="*{refinementDate}" placeholder="yyyy-mm-dd" />
									    </div>
									  </div>
									</div>								
	                        	</div>
								<div class="form-group">
									<label for="refinementMinutes">Refinement Minutes</label>
									<textarea class="form-control" th:field="*{refinementMinutes}" id="refinementMinutes" rows="10"></textarea>
								</div>
	  						  <button type="submit" class="btn btn-primary">Submit</button>
	  						</form>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <div th:replace="fragments/footer :: footer"></div>
        </div>
      </div>
    </div>
  </body>
  <script type="text/javascript">
    $( function() {
        $( "#datepicker" ).datepicker();
        $( "#datepicker" ).datepicker( "option", "dateFormat", "yy-mm-dd" );
      } );
  </script>
  <script>
    tinymce.init({
      selector: '#refinementMinutes',
      height: 350,
      plugins: 'advlist autolink lists link image charmap print preview hr anchor pagebreak',
      toolbar: 'alignleft aligncenter alignright alignjustify | formatselect | bullist numlist | outdent indent | link code',
      toolbar_mode: 'floating',
    });
  </script>
</html>
