<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <div th:replace="fragments/headerfiles :: headerfiles(pageTitle='Sprint Activity')"></div>
	<link href="http://ajax.googleapis.com/ajax/libs/jqueryui/1.12.1/themes/base/jquery-ui.css" rel="stylesheet" type="text/css"/>
	    <script src="https://cdn.tiny.cloud/1/xb35xk73hgyckinp46g6ivh20vtxgb0soa2tn1e22n7cc4iu/tinymce/5/tinymce.min.js" referrerpolicy="origin"></script>
  </head>
  <body>
    <div class="container-scroller">
      <div class="container-fluid page-body-wrapper">
        <!-- partial:../../partials/_sidebar.html -->
		<div th:replace="fragments/_sidebar :: _sidebar"></div>
        <!-- partial -->
        <div class="main-panel">
          <div class="content-wrapper">
            <div class="row">

              <div class="col-lg-12 grid-margin stretch-card">
                <div class="card">
                  <div class="card-body">
                       <form action="#" th:action="@{/sprint-activity-update/{id}(id=${sprintOject.id})}" method="post" th:object="${sprintOject}">
						   <div class="row">
							<div class="col-md-2">
							  <div class="form-group row">
							    <div class="col-sm-12">
							      <input type="text" class="form-control" th:name="sprintName" th:field="*{sprintName}" th:value="${sprintName}" placeholder="Sprint Name"/>
							      
							    </div>
							  </div>
							</div>
							<div class="col-md-2">
								<div class="form-group row">
								    <div class="col-sm-12">
								      <input type="text" class="form-control" th:name="sprintEndDate" th:field="*{sprintStartDate}" id="sprintStartDate" />
								      
								    </div>
								  </div>
							</div>
							<div class="col-md-2">
								<div class="form-group row">
								    <div class="col-sm-12">
								      <input type="text" class="form-control" th:name="sprintEndDate" th:field="*{sprintEndDate}" id="sprintEndDate" />
								 
								    </div>
								  </div>
							</div>
							<div class="col-md-2">
							  <div class="form-group row">
							    <div class="col-sm-9">
							     <select class="form-control" th:field="*{sprintStatus}" th:name="sprintStatus"  id="statulsListDDL">
									 <option value="All">--Status--</option>
							        <option th:each="p : ${statulsListDDL}" th:value="${p}" th:text="${p}" />
									
							      </select>
							    </div>
							  </div>
							</div>
							
							
                      </div>
							  <div class="form-group">
							    <label for="taskSummary">Activity Detail</label>
							    <textarea class="form-control" th:field="*{sprintActivity}" id="sprintActivity" rows="10"></textarea>
							   
							   
							  </div>
							  <button type="submit" class="btn btn-primary">Submit</button>
						</form> 
                  </div>
                </div>
              </div>
              
            </div>
          </div>
          <div th:replace="fragments/footer :: footer"></div>
          <script type="text/javascript">
			$( function() {
			        
					$( "#sprintStartDate" ).datepicker({ dateFormat: 'yy-mm-dd' });
			      } );
		  $( function() {
		         
				  $( "#sprintEndDate" ).datepicker({ dateFormat: 'yy-mm-dd' });
		        } );
				</script>
				<script>	
				    tinymce.init({
				      selector: '#sprintActivity',
				      height: 500,
				      plugins: 'advlist autolink lists link image charmap print preview hr anchor pagebreak',
				      //toolbar: 'a11ycheck addcomment showcomments casechange checklist code export formatpainter pageembed permanentpen table',
				      toolbar: 'alignleft aligncenter alignright alignjustify | formatselect | bullist numlist | outdent indent | link code',
				      toolbar_mode: 'floating',
				      tinycomments_mode: 'embedded',
				      tinycomments_author: 'Anuwas B',
				   });
  			</script>
              
              <!-- <script>
				    tinymce.init({
				      selector: '#refinementMinutes',
				      height: 300,
				      plugins: 'a11ychecker advcode casechange export formatpainter linkchecker autolink lists checklist media mediaembed pageembed permanentpen powerpaste table advtable tinycomments tinymcespellchecker',
				      //toolbar: 'a11ycheck addcomment showcomments casechange checklist code export formatpainter pageembed permanentpen table',
				      toolbar: 'alignleft aligncenter alignright alignjustify | formatselect | bullist numlist | outdent indent | link code',
				      toolbar_mode: 'floating',
				      tinycomments_mode: 'embedded',
				      tinycomments_author: 'Anuwas B',
				   });
  			</script> -->
        </div>
      </div>
    </div>
  </body>
</html>
